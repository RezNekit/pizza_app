{% extends "layout.html" %}
{% block content %}
  <a class="btn btn-primary mb-2" href="{{ url_for('customers.new_customer') }}">New Customer</a>
  {% if customers %}
  <table class="table table-striped align-middle">
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
    <tbody>
      {% for c in customers %}
      <tr>
        <td>{{ c.customer_id }}</td>
        <td>{{ c.first_name }} {{ c.last_name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}<p>No customers yet.</p>{% endif %}
{% endblock %}
